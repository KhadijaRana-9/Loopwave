server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback — same rule as vercel.json's rewrites: any path that isn't
    # a real static file falls back to index.html, so React Router's client-
    # side routes (e.g. /app/dashboard) work on a hard refresh/direct link.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets (Vite fingerprints filenames) are safe to cache
    # forever; index.html itself must always be revalidated.
    location ~* \.(js|css|svg|png|jpg|jpeg|gif|woff2?)$ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
